name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: construction-financial-control

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app tests scripts streamlit_app.py
      - name: Mypy type check
        run: mypy app

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest (SQLite — workflow, concurrency, idempotency, audit)
        run: python -m pytest tests/ -v

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cfcs
          POSTGRES_PASSWORD: cfcs
          POSTGRES_DB: cfcs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfcs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://cfcs:cfcs@localhost:5432/cfcs_test
      TEST_DATABASE_URL: postgresql+psycopg2://cfcs:cfcs@localhost:5432/cfcs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Alembic migrations against PostgreSQL
        run: alembic upgrade head
      - name: Pytest against PostgreSQL (row locks + audit trigger active)
        run: python -m pytest tests/ -v

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: End-to-end smoke test
        run: python scripts/smoke_test.py
