services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfcs
      POSTGRES_PASSWORD: cfcs
      POSTGRES_DB: cfcs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfcs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    # Schema via Alembic (never create_all), then demo seed, then serve.
    command: sh -c "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg2://cfcs:cfcs@db:5432/cfcs
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-only-secret-change-me-32chars-min!!
      CORS_ORIGINS: http://localhost:8501
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  ui:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Legacy Streamlit UI (superseded by the Next.js app on :3000).
  # Start with: docker compose --profile legacy up
  ui-streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    profiles: ["legacy"]
    depends_on:
      - api

  # Optional: nightly forecast snapshots. Start with: docker compose --profile worker up
  worker:
    build: .
    command: celery -A app.tasks worker --beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://cfcs:cfcs@db:5432/cfcs
      REDIS_URL: redis://redis:6379/0
    profiles: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
